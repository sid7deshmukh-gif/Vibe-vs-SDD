<!DOCTYPE html>
<html>
<head>
  <title>Reports Page</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    h1 { color: #333; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th { background-color: #4CAF50; color: white; padding: 10px; text-align: left; }
    td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    button { margin-top: 20px; padding: 10px 20px;
             background: green; color: white;
             border: none; cursor: pointer; border-radius: 5px; }
    button:disabled { background: grey; cursor: not-allowed; }
    #noDataMsg { color: red; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <h1>Reports Page</h1>
  <p>Export the report data using the button below.</p>

  <!-- Task 1.1: Export CSV button -->
  <button id="exportBtn" onclick="exportCSV()">Export CSV</button>
  <p id="noDataMsg">No data to export.</p>

  <!-- Report Table -->
  <table id="reportTable">
    <tr><th>Name</th><th>Sales</th><th>Region</th></tr>
    <tr><td>Alice</td><td>500</td><td>North</td></tr>
    <tr><td>Bob</td><td>300</td><td>South</td></tr>
    <tr><td>Charlie</td><td>700</td><td>East</td></tr>
  </table>

  <script>
    // Task 1.5: Disable button if no data
    const rows = document.querySelectorAll("#reportTable tr");
    const dataRows = rows.length - 1; // exclude header
    if (dataRows === 0) {
      document.getElementById("exportBtn").disabled = true;
      document.getElementById("noDataMsg").style.display = "block";
    }

    // Task 1.2 + 1.3: Convert to CSV and download
    function exportCSV() {
      const rows = document.querySelectorAll("#reportTable tr");
      let csv = "";
      rows.forEach(row => {
        const cols = row.querySelectorAll("th, td");
        const rowData = Array.from(cols).map(c => c.innerText).join(",");
        csv += rowData + "\n";
      });

      // Task 1.4: Add today's date to filename
      const today = new Date().toISOString().split("T")[0];
      const filename = "report-" + today + ".csv";

      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
    }
  </script>

</body>
</html>
